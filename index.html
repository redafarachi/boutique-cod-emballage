<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#D4AF37;--gold-d:#B8912E;--gold-l:#F1D77A;--bg:#0B0B0C;--panel:#151517;--panel2:#1E1E21;--ink:#F3E9D2;--muted:#9A9188;--line:#2A2A2E;--green:#25D366}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:50;background:rgba(11,11,12,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo img{height:44px;display:block}
.navlinks{display:flex;gap:22px;font-weight:700;font-size:15px}
.navlinks a:hover{color:var(--gold)}
@media(max-width:820px){.navlinks{display:none}}
.hero{padding:52px 0 40px;text-align:center;background:radial-gradient(1200px 400px at 50% -10%, rgba(212,175,55,.14), transparent 60%)}
.hero h1{font-size:clamp(28px,5vw,48px);font-weight:900;line-height:1.3}
.hero h1 .hl{background:linear-gradient(90deg,var(--gold-l),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:14px auto 0;color:#CFC4AB;max-width:560px}
.hero .feats{margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.feat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 15px;font-size:14px;font-weight:700}
section{padding:44px 0}
.shead{text-align:center;margin-bottom:28px}
.shead .kick{color:var(--gold);font-weight:800;font-size:15px}
.shead h2{font-size:clamp(24px,4vw,32px);font-weight:900;margin-top:4px}
.shead p{color:var(--muted);margin-top:6px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cat{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.18s;position:relative}
.cat:hover{border-color:var(--gold);transform:translateY(-3px)}
.cat.soon{opacity:.55;cursor:default}
.cat .ci{height:170px;background:#0d0d0e;display:grid;place-items:center;font-size:56px;overflow:hidden}
.cat .ci img{width:100%;height:100%;object-fit:cover}
.cat .cb{padding:16px 18px}
.cat .cb h3{font-size:19px;font-weight:900}
.cat .cb span{color:var(--muted);font-size:14px}
.cat .soonbadge{position:absolute;top:12px;inset-inline-end:12px;background:#000;border:1px solid var(--line);color:var(--muted);font-size:12px;padding:3px 10px;border-radius:20px}
@media(max-width:820px){.cats{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.cats{grid-template-columns:1fr}}
.backbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.backbar button{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-weight:700;padding:9px 16px;border-radius:12px;cursor:pointer}
.backbar h2{font-size:22px;font-weight:900}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.15s}
.prod:hover{border-color:var(--gold)}
.prod .pimg{aspect-ratio:1/1;background:#000;overflow:hidden}
.prod .pimg img{width:100%;height:100%;object-fit:cover}
.prod .pb{padding:14px 16px}
.prod h4{font-size:17px;font-weight:900}
.prices{display:flex;gap:8px;margin-top:10px}
.ptier{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px;text-align:center}
.ptier .lab{font-size:11px;color:var(--muted)}
.ptier .val{font-weight:900;font-size:15px;color:var(--gold)}
.prod .go{margin-top:12px;background:linear-gradient(145deg,var(--gold-l),var(--gold-d));color:#241c05;text-align:center;padding:10px;border-radius:10px;font-weight:800}
@media(max-width:820px){.prods{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.prods{grid-template-columns:1fr}}
/* product page */
.pp{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start}
.pp .big{background:#000;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pp .big img{width:100%;display:block}
.pp .info h1{font-size:28px;font-weight:900}
.pp .info .sub{color:var(--muted);margin-top:4px}
.pp .info .prices{margin-top:16px}
.pp .info .ptier .val{font-size:20px}
.form{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.form h3{font-size:18px;font-weight:900;margin-bottom:4px}
.form .fh{color:var(--muted);font-size:13px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.field input,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font-family:inherit;font-size:15px}
.field textarea{resize:vertical;min-height:60px}
.qtybox{display:flex;align-items:center;gap:10px}
.qtybox button{width:40px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:900;font-size:20px;cursor:pointer}
.qtybox input{text-align:center;font-weight:800;font-size:17px}
.livebill{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0;display:flex;justify-content:space-between;align-items:center}
.livebill .u{color:var(--muted);font-size:13px}
.livebill .t{font-weight:900;font-size:22px;color:var(--gold)}
.submit{width:100%;background:var(--green);color:#083d1c;font-family:inherit;font-weight:900;font-size:18px;border:none;padding:16px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.submit:disabled{opacity:.6;cursor:not-allowed}
.altwa{display:block;text-align:center;margin-top:10px;color:var(--muted);font-size:14px}
.altwa a{color:var(--green);font-weight:700}
@media(max-width:760px){.pp{grid-template-columns:1fr}}
.why{background:linear-gradient(180deg,#0d0d0e,#111)}
.whygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.wcard{text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 14px}
.wcard .ic{font-size:34px}.wcard b{display:block;margin-top:8px;font-size:17px}.wcard span{color:var(--muted);font-size:13.5px}
@media(max-width:760px){.whygrid{grid-template-columns:1fr 1fr}}
.contact{text-align:center}
.contact .wa{display:inline-flex;align-items:center;gap:10px;background:var(--green);color:#083d1c;padding:16px 30px;border-radius:16px;font-weight:900;font-size:18px}
.contact .info{margin-top:18px;color:var(--muted);display:flex;gap:22px;justify-content:center;flex-wrap:wrap;font-weight:700}
footer{background:#000;color:var(--muted);padding:26px 0;text-align:center;font-size:14px;border-top:1px solid var(--line)}
footer .slog{font-family:'Space Mono',monospace;letter-spacing:2px;color:var(--gold);font-size:12px;margin-top:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#000;border:1px solid var(--gold);color:var(--gold);padding:12px 22px;border-radius:30px;font-weight:800;z-index:120;opacity:0;transition:.3s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ok-screen{text-align:center;padding:40px 20px}
.ok-screen .big{font-size:60px}
.ok-screen h2{font-size:26px;font-weight:900;margin-top:10px}
.ok-screen p{color:var(--muted);margin-top:8px}
.ok-screen .home{display:inline-block;margin-top:20px;background:linear-gradient(145deg,var(--gold-l),var(--gold-d));color:#241c05;padding:12px 24px;border-radius:12px;font-weight:800}
</style>
</head>

function unitPrice(p,qty){return qty>=100?p.pGros:p.pDetail;}
function findP(id){for(var i=0;i<CATS.length;i++){var p=CATS[i].products.filter(function(x){return x.id===id;})[0];if(p)return p;}return null;}
var tid;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tid);tid=setTimeout(function(){t.classList.remove('on');},1800);}

/* ===== routing via hash ===== */
function nav(h){location.hash=h; if(h===''){window.scrollTo(0,0);} route();}
function route(){
  var h=location.hash.replace(/^#/,'');
  if(h.indexOf('p/')===0){ renderProduct(h.slice(2)); }
  else if(h.indexOf('cat/')===0){ renderCat(h.slice(4)); }
  else { renderHome(); }
}
window.addEventListener('hashchange',route);

function shell(inner){ return '<section>'+inner+'</section>'; }

function renderHome(){
  var app=document.getElementById('app');
  var html='<section class="hero"><div class="wrap"><h1>إمبالاج <span class="hl">احترافي</span> للـ e-commerce</h1>'+
    '<p>كرتون أمريكان بجودة عالية · حماية و مقاومة · أثمنة الجملة</p>'+
    '<div class="feats"><div class="feat">🛡️ حماية أكثر</div><div class="feat">💪 مقاومة</div><div class="feat">💰 أثمنة الجملة</div><div class="feat">🚚 توصيل لكل المغرب</div></div>'+
    '</div></section>';
  html+='<section id="cats"><div class="wrap"><div class="shead"><div class="kick">اختار الفئة</div><h2>المنتوجات ديالنا</h2><p>كليكي على فئة</p></div><div class="cats">'+
    CATS.map(function(c){
      if(c.soon)return '<div class="cat soon"><div class="soonbadge">قريباً</div><div class="ci">'+c.emoji+'</div><div class="cb"><h3>'+c.name+'</h3><span>'+c.sub+'</span></div></div>';
      var cover=c.products[0]?'<img src="'+c.products[0].img+'">':c.emoji;
      return '<div class="cat" onclick="nav(\'cat/'+c.id+'\')"><div class="ci">'+cover+'</div><div class="cb"><h3>'+c.name+'</h3><span>'+c.sub+'</span></div></div>';
    }).join('')+'</div></div></section>';
  html+=whySection()+contactSection();
  app.innerHTML=html;
}
function renderCat(id){
  var c=CATS.filter(function(x){return x.id===id;})[0]; if(!c){renderHome();return;}
  var html='<section><div class="wrap"><div class="backbar"><button onclick="nav(\'\')">‹ رجوع</button><h2>'+c.name+'</h2></div><div class="prods">'+
    c.products.map(function(p){
      return '<div class="prod" onclick="nav(\'p/'+p.id+'\')"><div class="pimg"><img src="'+p.img+'"></div><div class="pb"><h4>كرتون '+p.dim+'</h4>'+
        '<div class="prices"><div class="ptier"><div class="lab">≥100</div><div class="val">'+dh(p.pGros)+'</div></div><div class="ptier"><div class="lab">&lt;100</div><div class="val">'+dh(p.pDetail)+'</div></div></div>'+
        '<div class="go">اطلب الآن ‹</div></div></div>';
    }).join('')+'</div></div></section>';
  document.getElementById('app').innerHTML=html;
  window.scrollTo(0,0);
}
function renderProduct(id){
  var p=findP(id); if(!p){renderHome();return;}
  var html='<section><div class="wrap"><div class="backbar"><button onclick="history.length>1?history.back():nav(\'cat/carton\')">‹ رجوع</button></div>'+
    '<div class="pp"><div class="big"><img src="'+p.img+'"></div>'+
    '<div class="info"><h1>كرتون أمريكان '+p.dim+'</h1><div class="sub">Caisse américaine · جودة عالية · مقاومة</div>'+
    '<div class="prices"><div class="ptier"><div class="lab">≥ 100 حبة (جملة)</div><div class="val">'+dh(p.pGros)+'</div></div><div class="ptier"><div class="lab">&lt; 100 حبة</div><div class="val">'+dh(p.pDetail)+'</div></div></div>'+
    '<div class="form"><h3>🛒 اطلب الآن</h3><div class="fh">عمّر المعلومات و نتواصلو معاك لتأكيد الطلبية · الدفع عند الاستلام</div>'+
    '<div class="field"><label>الكمية</label><div class="qtybox"><button type="button" onclick="qc(-10)">−</button><input id="f_qty" type="number" min="1" value="100" oninput="bill()"><button type="button" onclick="qc(10)">＋</button></div></div>'+
    '<div class="livebill"><span class="u" id="f_unit"></span><span class="t" id="f_total"></span></div>'+
    '<div class="field"><label>الاسم الكامل *</label><input id="f_name" placeholder="الاسم ديالك"></div>'+
    '<div class="field"><label>رقم الهاتف *</label><input id="f_phone" type="tel" placeholder="06 ..." inputmode="tel"></div>'+
    '<div class="field"><label>المدينة *</label><input id="f_city" placeholder="مثلا Casablanca"></div>'+
    '<div class="field"><label>العنوان *</label><textarea id="f_addr" placeholder="الحي، الشارع، رقم..."></textarea></div>'+
    '<button class="submit" id="f_submit" onclick="submitOrder(\''+p.id+'\')">✅ اطلب الآن</button>'+
    '<span class="altwa">وﻻ اطلب مباشرة عبر <a href="#" id="f_wa" target="_blank">WhatsApp</a></span>'+
    '</div></div></div></div></section>';
  document.getElementById('app').innerHTML=html;
  window.scrollTo(0,0);
  window.__P=p; bill();
}
function qc(d){var i=document.getElementById('f_qty');var v=(parseInt(i.value)||0)+d;if(v<1)v=1;i.value=v;bill();}
function bill(){var p=window.__P;if(!p)return;var q=parseInt(document.getElementById('f_qty').value)||0;var u=unitPrice(p,q);
  document.getElementById('f_unit').textContent=q+' × '+dh(u)+(q>=100?' (جملة)':'');
  document.getElementById('f_total').textContent=dh(q*u);
  var msg=encodeURIComponent('السلام، بغيت نطلب:\n📦 كرتون '+p.dim+'\nالكمية: '+q+'\nالمجموع: '+dh(q*u));
  var wa=document.getElementById('f_wa'); if(wa) wa.href='https://wa.me/'+WHATSAPP+'?text='+msg;
}
async function submitOrder(pid){
  var p=findP(pid);var q=parseInt(document.getElementById('f_qty').value)||0;
  var name=document.getElementById('f_name').value.trim();
  var phone=document.getElementById('f_phone').value.trim();
  var city=document.getElementById('f_city').value.trim();
  var addr=document.getElementById('f_addr').value.trim();
  if(!name||!phone||!city||!addr){toast('عمّر جميع الخانات المطلوبة');return;}
  if(q<1){toast('الكمية غير صحيحة');return;}
  var u=unitPrice(p,q);var total=q*u;
  var btn=document.getElementById('f_submit');btn.disabled=true;btn.textContent='⏳ كنصيفطو...';
  var ok=false;
  if(SB){
    try{
      var res=await SB.from('orders').insert({product:'Carton '+p.dim,qty:q,unit_price:u,total:total,client_name:name,phone:phone,city:city,address:addr,status:'new'});
      if(!res.error) ok=true; else console.error(res.error);
    }catch(e){console.error(e);}
  }
  if(ok){ renderOK(p,q,total,name); }
  else{
    // fallback WhatsApp si erreur
    var msg=encodeURIComponent('🛒 طلبية جديدة\n📦 كرتون '+p.dim+'\nالكمية: '+q+' × '+dh(u)+' = '+dh(total)+'\nالاسم: '+name+'\nالهاتف: '+phone+'\nالمدينة: '+city+'\nالعنوان: '+addr);
    toast('نكمّلو عبر WhatsApp');
    window.open('https://wa.me/'+WHATSAPP+'?text='+msg,'_blank');
    btn.disabled=false;btn.textContent='✅ اطلب الآن';
  }
}
function renderOK(p,q,total,name){
  document.getElementById('app').innerHTML='<section><div class="wrap"><div class="ok-screen"><div class="big">✅</div>'+
    '<h2>تم تسجيل الطلبية!</h2>'+
    '<p>شكرا '+name+' 🙏<br>طلبتي <b>'+q+'</b> ديال كرتون '+p.dim+' · المجموع <b>'+dh(total)+'</b><br>غادي نتواصلو معاك على '+'</p>'+
    '<a class="home" href="#" onclick="nav(\'\');return false;">‹ العودة للمنتوجات</a>'+
    '</div></div></section>';
  window.scrollTo(0,0);
}
function whySection(){return '<section class="why" id="why"><div class="wrap"><div class="shead"><h2 style="color:var(--ink)">علاش الـ e-commerçant كيختارونا</h2></div><div class="whygrid">'+
  '<div class="wcard"><div class="ic">🛡️</div><b>حماية مضمونة</b><span>المنتوج كيوصل سالم</span></div>'+
  '<div class="wcard"><div class="ic">💎</div><b>جودة عالية</b><span>كرتون قوي و متين</span></div>'+
  '<div class="wcard"><div class="ic">💰</div><b>أثمنة الجملة</b><span>حسب الكمية</span></div>'+
  '<div class="wcard"><div class="ic">🚚</div><b>توصيل لكل المغرب</b><span>من Casablanca</span></div>'+
  '</div></div></section>';}
function contactSection(){return '<section id="contact" class="contact"><div class="wrap"><div class="shead"><div class="kick">واجدين نعاونوك</div><h2>تواصل معانا</h2></div>'+
  '<a class="wa" href="https://wa.me/'+WHATSAPP+'" target="_blank">💬 راسلنا على WhatsApp</a>'+
  '<div class="info"><span>📞 0663 283 658</span><span>📷 codemballage</span><span>📘 Cod Emballage</span><span>📍 Casablanca</span></div>'+
  '</div></section>';}
document.getElementById('waTop').href='https://wa.me/'+WHATSAPP;
route();
</script>
</body>
</html>
